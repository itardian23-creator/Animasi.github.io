<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman Bicara</title>
<style>
:root{--bg1:#BFE6F2;--bg2:#F4FBF8;--ink:#16343A;--chip:#FFFFFFD9;--btn:#2E9C8F;--btnink:#fff;--sun:#F6A23C;
 --f:"Baloo 2","Trebuchet MS",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg1:#10343F;--bg2:#0D1F24;--ink:#EAF6F4;--chip:#17333ACC;--btn:#4DBBAE;--btnink:#06231F}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--f);color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.chip{position:absolute;left:50%;transform:translateX(-50%);top:14px;background:var(--chip);border-radius:99px;padding:6px 20px;font-weight:600;font-size:1.05rem;max-width:92%;text-align:center}
#zzz{position:absolute;right:22%;top:22%;font-size:2.2rem;font-weight:800;opacity:0;transition:opacity .4s}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 12px 4px}
button{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:99px;padding:12px 24px;background:var(--btn);color:var(--btnink);cursor:pointer;min-height:48px}
button.mic{background:var(--sun);color:#2A1A05}
button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
form{display:flex;gap:8px;padding:6px 12px;max-width:560px;width:100%;margin:0 auto}
input{flex:1;font:inherit;font-size:1.05rem;border:2px solid var(--btn);border-radius:99px;padding:10px 18px;background:var(--chip);color:var(--ink);min-width:0}
.chars{padding-bottom:0}.chars button{font-size:.95rem;padding:6px 16px;min-height:40px;background:var(--chip);color:var(--ink);border:2px solid var(--btn)}.chars button[aria-pressed="true"]{background:var(--btn);color:var(--btnink);outline:none}
.credit{font-size:.8rem;text-align:center;padding:0 12px 10px;opacity:.75;font-weight:600;margin:0}
</style>
</head>
<body>
<div id="stage"><div class="chip" id="status">Sentuh aku!</div><div id="zzz">Zzz</div></div>
<div class="bar chars"><button id="bWuff" aria-pressed="true">🐺 Kak Wuff</button><button id="bNaga" aria-pressed="false">🐉 Kak Naga</button></div>
<div class="bar">
  <button id="bMic" class="mic" aria-pressed="false">🎤 Ajak aku ngobrol</button>
  <button id="bHop">Lompat</button><button id="bDance">Joget</button>
  <button id="bSleep" aria-pressed="false">Tidur</button>
</div>
<form id="fTxt"><input id="tTxt" placeholder="Atau ketik di sini…" autocomplete="off" maxlength="200"><button>Kirim</button></form>
<p class="credit" id="credit">Model: “Toothless Chibi” oleh Maximum993 (CC BY 4.0). Hanya untuk uji coba, ganti dengan karakter orisinal untuk versi akhir. Suara anak dikirim ke layanan Groq untuk diproses.</p>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=id=>document.getElementById(id), stage=$("stage");
const MOUTH={x:-0.10,y:1.02,z:0.79,w:0.12,hmax:0.11}; // posisi mulut pada model ini; sesuaikan jika model diganti
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputEncoding=THREE.sRGBEncoding; stage.prepend(renderer.domElement);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(35,1,.1,50);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,1.2));
const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(2,4,3); scene.add(sun);
const sc=document.createElement("canvas"); sc.width=sc.height=128; const g=sc.getContext("2d");
const gr=g.createRadialGradient(64,64,4,64,64,62); gr.addColorStop(0,"rgba(0,0,0,.35)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.position.y=.005; scene.add(shadow);
// ---- rahang model asli: putar bagian bawah mulut di sekitar engsel ----
const JAW={hy:-0.60,hz:3.80,zTop:3.80,zFull:3.70,zFadeLo:3.30,zFadeHi:2.95,yNear:-0.55,yFar:-0.85,xFull:0.65,xZero:0.95,max:0.42};
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function jawW(x,y,z){
  const wlow=sstep(JAW.zFadeHi,JAW.zFadeLo,z);
  return sstep(JAW.zTop,JAW.zFull,z)*wlow*sstep(JAW.yNear,JAW.yFar,y)*(1-sstep(JAW.xFull,JAW.xZero,Math.abs(x)));
}
const jawParts=[];
function prepJaw(root){root.traverse(o=>{if(!o.isMesh)return;const p=o.geometry.attributes.position,n=p.count,w=new Float32Array(n);let any=false;
  for(let i=0;i<n;i++){w[i]=jawW(p.getX(i),p.getY(i),p.getZ(i));if(w[i]>0)any=true;}
  if(any)jawParts.push({p,o0:p.array.slice(),w});});}
function setJaw(a){for(const {p,o0,w} of jawParts){const A=p.array;for(let i=0;i<w.length;i++){const k=w[i];if(!k){continue;}
  const x=o0[i*3],dy=o0[i*3+1]-JAW.hy,dz=o0[i*3+2]-JAW.hz,t=a*k,c=Math.cos(t),s=Math.sin(t);
  A[i*3]=x;A[i*3+1]=JAW.hy+dy*c-dz*s;A[i*3+2]=JAW.hz+dy*s+dz*c;}p.needsUpdate=true;}}

const body=new THREE.Group(); scene.add(body); let loaded=false,userRot=0;

// mulut buatan: bukaan gelap yang turun dari garis mulut, dengan lidah
const mouth=new THREE.Group(), mOpen=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0x0d0206,side:THREE.DoubleSide})),
 mTongue=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:0xff7f9a,side:THREE.DoubleSide}));
mTongue.position.z=.001; mouth.add(mOpen,mTongue); mouth.visible=false; body.add(mouth);

function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h;
  const d=cam.aspect<.8?6.4:4.6; cam.position.set(0,1.15,d); cam.lookAt(0,.8,0); cam.updateProjectionMatrix();}
addEventListener("resize",resize); resize();
const NAGA_URI="assets/naga.glb";
const WUFF_URI="assets/wuff.glb";

// ===== karakter: Kak Naga (Toothless Chibi) dan Kak Wuff =====
const CH={
 naga:{name:"Kak Naga",pitch:1.5,btn:"bNaga",credit:"Model: “Toothless Chibi” oleh Maximum993 (CC BY 4.0). Hanya untuk uji coba, ganti dengan karakter orisinal untuk versi akhir."},
 wuff:{name:"Kak Wuff",pitch:1.25,btn:"bWuff",credit:"Model: “Wuff” oleh Zab (sketchfab.com/lixyco), CC BY 4.0. Diubah: pose, ukuran kepala, rahang, dan animasi."}
};
let charId=null,current=null,rig=null,loadTok=0,NAMA="Kak Wuff";

function buildNaga(gltf){
  const m=gltf.scene,box=new THREE.Box3().setFromObject(m); m.scale.setScalar(1.7/box.getSize(new THREE.Vector3()).y);
  const b2=new THREE.Box3().setFromObject(m),c=b2.getCenter(new THREE.Vector3()); m.position.set(-c.x,-b2.min.y,-c.z); prepJaw(m); return m;
}
function posedBox(m){ // kotak batas setelah pose (lewat skinning), bukan pose bind
  m.updateMatrixWorld(true); const bx=new THREE.Box3(),v=new THREE.Vector3();
  m.traverse(o=>{if(!o.isSkinnedMesh)return;o.skeleton.update();const p=o.geometry.attributes.position;
    for(let i=0;i<p.count;i+=2){v.fromBufferAttribute(p,i);o.boneTransform(i,v);v.applyMatrix4(o.matrixWorld);bx.expandByPoint(v);}});
  return bx;
}
function buildWuff(gltf){
  const m=gltf.scene,B={};
  m.traverse(o=>{if(o.isBone)B[o.name]=o;if(o.isSkinnedMesh)o.frustumCulled=false;});
  m.updateMatrixWorld(true);
  const head=B.Head_044;
  // rahang asli: tulang baru di bawah kepala, bobot kulit untuk dagu, dan garis bibir dipotong agar bisa membuka
  const JW={hy:1.80,hz:0.12,lip:1.857,zMin:0.16,zFull:0.26,xFull:0.09,xZero:0.17,yLow:1.74,yLow2:1.66,cutX:0.15,cutZ:0.2};
  const sst=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
  const jaw=new THREE.Bone(); jaw.name="Jaw"; jaw.position.copy(head.worldToLocal(new THREE.Vector3(0,JW.hy,JW.hz))); head.add(jaw); m.updateMatrixWorld(true);
  {const v=new THREE.Vector3();
  m.traverse(o=>{if(!o.isSkinnedMesh)return;const sk=o.skeleton;sk.update();
    const g=o.geometry,p=g.attributes.position,si=g.attributes.skinIndex,sw=g.attributes.skinWeight,n=p.count,hi=sk.bones.indexOf(head),jawIdx=sk.bones.length;
    const jawInv=new THREE.Matrix4().copy(jaw.matrixWorld).invert().multiply(head.matrixWorld).multiply(sk.boneInverses[hi]);
    const NI=new Uint16Array(n*4),NW=new Float32Array(n*4),X=new Float32Array(n),Y=new Float32Array(n),Z=new Float32Array(n);
    for(let i=0;i<n;i++){v.fromBufferAttribute(p,i);o.boneTransform(i,v);v.applyMatrix4(o.matrixWorld);X[i]=v.x;Y[i]=v.y;Z[i]=v.z;
      const k=v.y<JW.lip?(1-sst(JW.xFull,JW.xZero,Math.abs(v.x)))*sst(JW.zMin,JW.zFull,v.z)*sst(JW.yLow2,JW.yLow,v.y):0;
      const ids=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)],ws=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)];
      if(k>0){let q=0;for(let j=1;j<4;j++)if(ws[j]<ws[q])q=j;ids[q]=jawIdx;for(let j=0;j<4;j++)ws[j]*=(1-k);ws[q]=k;}
      const sum=ws[0]+ws[1]+ws[2]+ws[3]||1;for(let j=0;j<4;j++){NI[i*4+j]=ids[j];NW[i*4+j]=ws[j]/sum;}}
    g.setAttribute("skinIndex",new THREE.BufferAttribute(NI,4));g.setAttribute("skinWeight",new THREE.BufferAttribute(NW,4));
    if(o.name==="Object_102"){const ix=g.index.array,out=[];
      for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2],mn=Math.min(Y[a],Y[b],Y[c]),mx=Math.max(Y[a],Y[b],Y[c]),cx=(X[a]+X[b]+X[c])/3,cz=(Z[a]+Z[b]+Z[c])/3;
        if(mn<JW.lip&&mx>=JW.lip&&Math.abs(cx)<JW.cutX&&cz>JW.cutZ)continue;out.push(a,b,c);}
      g.setIndex(new THREE.BufferAttribute(new Uint32Array(out),1));}
    o.bind(new THREE.Skeleton([...sk.bones,jaw],[...sk.boneInverses,jawInv]),o.bindMatrix);});}

  const names=["Shoulder_L_05","Shoulder_R_024","Head_044","lEar_045","rEar_048","Tail1_00","Tail2_01","Tail3_062","Tail4_063","Tail5_064"],rest=new Map();
  for(const n of names)rest.set(B[n],B[n].quaternion.clone()); rest.set(jaw,jaw.quaternion.clone());
  const tail=["Tail1_00","Tail2_01","Tail3_062","Tail4_063","Tail5_064"].map(n=>B[n]);
  head.scale.multiplyScalar(1.3); // kepala lebih besar agar lebih imut
  const AZ=new THREE.Vector3(0,0,1),AY=new THREE.Vector3(0,1,0),AX=new THREE.Vector3(1,0,0),qP=new THREE.Quaternion(),qR=new THREE.Quaternion(),qX=new THREE.Quaternion();
  function rotB(bone,axis,ang){ // putar tulang pada sumbu bingkai model, dari pose diamnya
    qP.identity(); const ch=[]; for(let o=bone.parent;o&&o!==m;o=o.parent)ch.push(o); for(let i=ch.length-1;i>=0;i--)qP.multiply(ch[i].quaternion);
    qR.setFromAxisAngle(axis,ang); qX.copy(qP).invert().multiply(qR).multiply(qP);
    bone.quaternion.copy(rest.get(bone)).premultiply(qX); bone.updateMatrix(); bone.updateMatrixWorld(true);
  }
  let armL=1.25,armR=1.25,earT=-9,earNext=2;
  function pose(dt){
    const p=T-t0,air=Math.min(1,cur.y/.4); let aL=1.25,aR=1.25,tw=.35,tf=2.2;
    if(mode==="dance"){aL=.95+.75*Math.sin(p*8);aR=.95-.75*Math.sin(p*8);tw=.7;tf=8;}
    else if(mode==="hop"||mode==="tap"){aL=aR=1.25-1.0*air;tw=.6;tf=7;}
    else if(mode==="sleep"){aL=aR=1.32;tw=.08;tf=.8;}
    else{aL+=.06*Math.sin(T*1.7);aR+=.06*Math.sin(T*1.7+1.3);}
    if(speaking){aR+=.25*mouthC*Math.sin(T*5.5)-.15;tw=Math.max(tw,.5);tf=Math.max(tf,5);}
    else if(think){aR=.75+.1*Math.sin(T*3);tw=.15;}
    else if(listen){tw=.3;}
    const e=1-Math.exp(-dt*12); armL+=(aL-armL)*e; armR+=(aR-armR)*e;
    rotB(B.Shoulder_L_05,AZ,-armL); rotB(B.Shoulder_R_024,AZ,armR);
    const ph=T*tf; tail.forEach((b,i)=>rotB(b,AY,tw*.35*Math.sin(ph-i*.6)*(1+i*.15)));
    if(T>earNext){earT=T;earNext=T+2.5+Math.random()*3;}
    const eb=Math.max(0,1-(T-earT)*3)*Math.sin((T-earT)*30); rotB(B.lEar_045,AZ,.25*eb); rotB(B.rEar_048,AZ,-.25*eb);
    rotB(B.Head_044,AX,.1*mouthC+(think?.0:0)); 
    rotB(jaw,AX,-.13+.46*mouthC); // rahang membuka mengikuti suara
  }
  pose(0); armL=1.25; armR=1.25;
  const bx=posedBox(m),sz=bx.getSize(new THREE.Vector3()),c=bx.getCenter(new THREE.Vector3()),s=1.9/sz.y;
  m.scale.setScalar(s); m.position.set(-c.x*s,-bx.min.y*s,-c.z*s);
  rig={update:pose};
  return m;
}
function setChar(id){
  const tok=++loadTok; charId=id; NAMA=CH[id].name;
  for(const k in CH)$(CH[k].btn).setAttribute("aria-pressed",String(k===id));
  $("credit").textContent=CH[id].credit+" Suara anak dikirim ke layanan Groq untuk diproses.";
  loaded=false; rig=null; jawParts.length=0; hist=[];
  if(current){body.remove(current);current.traverse(o=>{if(o.geometry)o.geometry.dispose();});current=null;}
  say("Memuat "+NAMA+"…",9e9);
  fetch(id==="wuff"?WUFF_URI:NAGA_URI).then(r=>r.arrayBuffer()).then(b=>new THREE.GLTFLoader().parse(b,"",gltf=>{
    if(tok!==loadTok)return;
    const m=id==="wuff"?buildWuff(gltf):buildNaga(gltf);
    body.add(m); current=m; loaded=true; idleText();
  },e=>say("Model gagal dimuat"))).catch(e=>say("Model gagal dimuat"));
}
function hitChar(){
  if(charId==="naga")return ray.intersectObject(body,true).length>0;
  for(const y of [.35,.8,1.25,1.65]){const c=body.localToWorld(new THREE.Vector3(0,y,0));if(ray.ray.distanceToPoint(c)<.36)return true;}
  return false;
}

// ===== animasi badan =====
let T=0,mode="idle",t0=0,sleeping=false,listen=false,think=false,speaking=false,mouthT=0,mouthC=0,jit=0,nextJit=0;
const cur={y:0,sx:1,sy:1,rz:0,ry:0}; function go(m){mode=m;t0=T;}
function target(){
  const p=T-t0,o={y:0,sx:1,sy:1,rz:0,ry:0};
  if(mode==="hop"||mode==="tap"){const D=mode==="tap"?.8:1,q=p/D;
    if(q>=1)go(sleeping?"sleep":"idle");
    else if(q<.2){const k=q/.2;o.sy=1-.22*k;o.sx=1+.12*k;}
    else if(q<.75){const r=(q-.2)/.55;o.y=.55*4*r*(1-r);o.sy=1+.12*Math.sin(r*Math.PI);o.sx=1-.06*Math.sin(r*Math.PI);o.ry=mode==="hop"?r*Math.PI*2:0;}
    else{const r=(q-.75)/.25;o.sy=1-.18*Math.sin(r*Math.PI);o.sx=1+.1*Math.sin(r*Math.PI);}
  }else if(mode==="dance"){if(p>4)go("idle");o.y=.12*Math.abs(Math.sin(p*8));o.rz=.22*Math.sin(p*4);o.sy=1+.06*Math.sin(p*16);o.sx=1-.03*Math.sin(p*16);}
  else if(mode==="sleep"){o.sy=1+.03*Math.sin(T*1.1);o.sx=1-.015*Math.sin(T*1.1);o.rz=.14;o.y=-.02;}
  else{o.y=.012*Math.sin(T*2.2);o.sy=1+.016*Math.sin(T*2.2);o.sx=1-.008*Math.sin(T*2.2);o.ry=.22*Math.sin(T*.6);}
  if(speaking){o.sy+=mouthC*.05;o.y+=mouthC*.015;o.rz+=.05*Math.sin(T*3);}
  else if(think){o.rz+=.2*Math.sin(T*2);o.ry+=.25*Math.sin(T*1.3);}
  else if(listen){o.rz+=.18;o.sy+=.03;}
  return o;
}
function frame(now){
  const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;T+=dt;
  if(speaking){ if(T>nextJit){jit=Math.random();nextJit=T+.07+Math.random()*.09;} mouthT=.12+.88*jit*(.6+.4*Math.abs(Math.sin(T*9))); }
  mouthC+=(mouthT-mouthC)*(1-Math.exp(-dt*22));
  if(loaded){
    const tg=target(),k=1-Math.exp(-dt*(mode==="hop"||mode==="tap"?30:12)); for(const n in cur)cur[n]+=(tg[n]-cur[n])*k;
    body.position.y=cur.y;body.scale.set(cur.sx,cur.sy,cur.sx);body.rotation.z=cur.rz;body.rotation.y=cur.ry+userRot;
    const sh=1-Math.min(.5,cur.y*.8);shadow.scale.set(sh*cur.sx,sh*cur.sx,1);
    setJaw(mouthC*JAW.max); if(rig)rig.update(dt);
  }
  micTick(now); renderer.render(scene,cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===== sentuhan =====
const ray=new THREE.Raycaster(),cv=renderer.domElement;let down=null,moved=false;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,r:userRot};moved=false;ctxInit();});
cv.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>8)moved=true;if(moved)userRot=down.r+dx*.01;});
addEventListener("pointerup",e=>{if(down&&!moved&&loaded){const r=cv.getBoundingClientRect(),v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v,cam);if(hitChar()&&!speaking){if(sleeping)wake();go("tap");giggle();say("Hihi, geli!");}}down=null;});
let sayT;function say(s,ms=1800){$("status").textContent=s;clearTimeout(sayT);if(ms<9e8)sayT=setTimeout(idleText,ms);}
function idleText(){$("status").textContent=micOn?"Ayo bicara padaku!":(sleeping?"Zzz…":"Sentuh aku!");}
function wake(){sleeping=false;$("bSleep").setAttribute("aria-pressed","false");$("zzz").style.opacity=0;go("idle");}
$("bHop").onclick=()=>{ctxInit();if(sleeping)wake();go("hop");blip(520,.12);say("Hop!");};
$("bDance").onclick=()=>{ctxInit();if(sleeping)wake();go("dance");giggle();say("Ayo joget!",3500);};
$("bSleep").onclick=()=>{sleeping=!sleeping;$("bSleep").setAttribute("aria-pressed",sleeping);$("zzz").style.opacity=sleeping?1:0;go(sleeping?"sleep":"idle");say(sleeping?"Zzz…":"Aku bangun!");};

// ===== suara efek =====
let ctx;function ctxInit(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();}
function blip(f,d=.1,w=0){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+w;o.type="triangle";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.02);}
function giggle(){ctxInit();[600,760,680,860].forEach((f,i)=>{blip(f,.09,i*.1);setTimeout(()=>{mouthT=.6;setTimeout(()=>{if(!speaking)mouthT=0;},70);},i*100);});}


// ===== Groq langsung dari browser. Kunci TIDAK ada di file; diminta sekali lalu disimpan di perangkat =====
let GROQ_KEY=""; try{GROQ_KEY=localStorage.getItem("groq_key")||"";}catch(e){}
function pastikanKunci(){
  if(GROQ_KEY)return true;
  const k=(prompt("Masukkan kunci API Groq (diawali gsk_). Disimpan hanya di perangkat ini.")||"").trim();
  if(!k)return false;
  GROQ_KEY=k; try{localStorage.setItem("groq_key",k);}catch(e){} return true;
}
function hapusKunci(){GROQ_KEY=""; try{localStorage.removeItem("groq_key");}catch(e){}}
const CHAT_MODEL="llama-3.3-70b-versatile",STT_MODEL="whisper-large-v3-turbo";
const sysPrompt=()=>`Kamu adalah ${NAMA}, teman bicara yang ramah untuk anak-anak yang dirawat di rumah sakit.
Aturan:
- Jawab dalam bahasa Indonesia yang sederhana, hangat, dan ceria. Maksimal 2 kalimat pendek.
- Kamu BUKAN dokter. Jangan mendiagnosis, jangan menyebut dosis atau cara memakai obat, jangan menggantikan nasihat dokter atau perawat.
- Jika anak bertanya soal sakit, obat, atau tindakan medis, jawab singkat dan menenangkan, lalu sarankan bertanya ke perawat atau dokter.
- Jika anak bilang sakit, takut, sesak, atau butuh bantuan, minta ia menekan bel atau memanggil perawat sekarang.
- Jangan menakut-nakuti. Jangan minta nama lengkap, alamat, atau data pribadi lain.
- Ajak bermain tebak-tebakan, bercerita singkat, atau tarik napas dalam. Tolak topik yang tidak pantas untuk anak dengan lembut.`;
let chatModel=null,gagal=new Set();
async function pilihModel(){
  if(!pastikanKunci())throw new Error("Kunci Groq belum diisi");
  const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{Authorization:"Bearer "+GROQ_KEY}});
  const j=await r.json(); if(!r.ok){if(r.status===401)hapusKunci(); throw new Error(j.error?.message||"Groq error");}
  const ids=(j.data||[]).filter(m=>m.active!==false).map(m=>m.id).filter(id=>!gagal.has(id)&&!/whisper|guard|tts|playai|orpheus|embed|safeguard|distil/i.test(id));
  const pref=[/llama-3\.3-70b/,/llama-3\.1-8b-instant/,/llama-4/,/llama/,/gpt-oss-20b/,/gpt-oss/,/qwen/];
  for(const p of pref){const m=ids.find(id=>p.test(id));if(m)return m;}
  if(ids[0])return ids[0]; throw new Error("Tidak ada model chat yang tersedia untuk kunci ini");
}
async function groqChat(msgs){
  if(!chatModel)chatModel=CHAT_MODEL;
  for(let i=0;i<4;i++){
    try{const t=await groqChat2(msgs,chatModel); if(t)return t; gagal.add(chatModel); console.warn("Balasan kosong dari",chatModel);}
    catch(e){ if(!/model|not found|decommission|access/i.test(e.message))throw e; gagal.add(chatModel); console.warn("Model gagal",chatModel,e.message);}
    chatModel=await pilihModel(); console.log("Pakai model:",chatModel);
  }
  throw new Error("Semua model gagal membalas");
}
async function groqChat2(msgs,model){
  if(!pastikanKunci())throw new Error("Kunci Groq belum diisi");
  const body={model:model,temperature:.6,max_tokens:600,messages:[{role:"system",content:sysPrompt()},...msgs.map(m=>({role:m.role,content:String(m.content).slice(0,500)}))]};
  if(/gpt-oss/i.test(model))body.reasoning_effort="low";
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{Authorization:"Bearer "+GROQ_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok){if(r.status===401)hapusKunci(); throw new Error(j.error?.message||"Groq error");}
  return (j.choices?.[0]?.message?.content||"").replace(/<think>[\s\S]*?<\/think>/g,"").trim();
}
async function groqSTT(blob){
  if(!pastikanKunci())throw new Error("Kunci Groq belum diisi");
  const t=blob.type||"audio/webm",ext=t.includes("mp4")?"mp4":t.includes("ogg")?"ogg":"webm",fd=new FormData();
  fd.append("file",new Blob([blob],{type:t}),"rekaman."+ext);fd.append("model",STT_MODEL);fd.append("language","id");fd.append("temperature","0");fd.append("response_format","json");
  const r=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+GROQ_KEY},body:fd});
  const j=await r.json(); if(!r.ok){if(r.status===401)hapusKunci(); throw new Error(j.error?.message||"Groq error");}
  return (j.text||"").trim();
}
// ===== bicara: mikrofon -> Groq (lewat server) -> suara + mulut =====
let micOn=false,stream,an,rec,chunks=[],state="wait",noise=.01,quietSince=0,recStart=0,hist=[],voice=null;
const buf=new Float32Array(1024);
const rms=a=>{a.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);};
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang.toLowerCase().startsWith("id"))||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
$("bMic").onclick=async()=>{
  ctxInit();
  if(micOn){micOn=false;stream.getTracks().forEach(t=>t.stop());$("bMic").setAttribute("aria-pressed","false");$("bMic").textContent="🎤 Ajak aku ngobrol";listen=false;say("Mikrofon mati");return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
    rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=sendAudio;
    micOn=true;state="wait";$("bMic").setAttribute("aria-pressed","true");$("bMic").textContent="⏹ Matikan mikrofon";say("Ayo bicara padaku!",9e9);
  }catch(e){say("Mikrofon tidak bisa dipakai. Cek izin browser dan pakai localhost atau HTTPS.",6000);}
};
function micTick(now){
  if(!micOn)return;const v=rms(an),thr=Math.max(.035,noise*3);
  if(state==="wait"){if(v<thr)noise=noise*.98+v*.02;if(v>thr){state="rec";chunks=[];rec.start();recStart=now;quietSince=0;listen=true;$("status").textContent="Aku mendengarkan…";}}
  else if(state==="rec"){if(v<thr){if(!quietSince)quietSince=now;}else quietSince=0;
    if((quietSince&&now-quietSince>800)||now-recStart>8000){state="busy";listen=false;rec.stop();}}
}
async function sendAudio(){
  if(performance.now()-recStart<600){state="wait";idleText();return;}
  think=true;say("Hmm, aku dengar dulu…",9e9);
  try{
    const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    const j={text:await groqSTT(blob)};
    if(j.text.length<2){think=false;state="wait";say("Aku belum dengar. Coba lagi, ya!",2500);return;}
    await tanya(j.text);
  }catch(e){think=false;state="wait";say("Error: "+(e&&e.message||e),12000);console.error(e);}
}
async function tanya(teks){
  think=true;state="busy";say("Hmm, aku mikir dulu…",9e9);
  hist.push({role:"user",content:teks});
  try{
    const j={reply:await groqChat(hist.slice(-10))};
    if(!j.reply)throw new Error("kosong");
    hist.push({role:"assistant",content:j.reply});think=false;ucap(j.reply);
  }catch(e){hist.pop();think=false;state=micOn?"wait":"wait";say("Error: "+(e&&e.message||e),12000);console.error(e);}
}
function selesai(){speaking=false;mouthT=0;setTimeout(()=>{state="wait";idleText();},500);}
function ucap(teks){
  state="talk";say(teks,9e9);
  if(!("speechSynthesis" in window)){speaking=true;setTimeout(selesai,Math.min(8000,teks.length*70));return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(teks);u.lang="id-ID";if(voice)u.voice=voice;u.pitch=CH[charId].pitch;u.rate=1.05;
  u.onstart=()=>{speaking=true;};u.onboundary=()=>{jit=1;nextJit=T+.12;};u.onend=selesai;u.onerror=selesai;
  speechSynthesis.speak(u);
}
$("fTxt").onsubmit=e=>{e.preventDefault();ctxInit();const t=$("tTxt").value.trim();if(!t||state==="talk"||think)return;$("tTxt").value="";if(sleeping)wake();tanya(t);};
$("bWuff").onclick=()=>{ctxInit();if(state==="talk"||think||charId==="wuff")return;setChar("wuff");};
$("bNaga").onclick=()=>{ctxInit();if(state==="talk"||think||charId==="naga")return;setChar("naga");};
setChar("wuff");
</script>
